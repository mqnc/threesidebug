<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">

	<title>Side Bug</title>
	<script type="importmap">
		{"imports": {
			"three": "https://cdn.jsdelivr.net/npm/three@v0.186.0/build/three.module.js",
			"three/addons/": "https://cdn.jsdelivr.net/npm/three@v0.186.0/examples/jsm/"
		  }}
	  </script>
</head>

<body style="margin:0; overflow:hidden;">
	<script type="module">
		import * as THREE from 'three'
		import { OrbitControls } from 'three/addons/controls/OrbitControls.js'

		let renderer = new THREE.WebGLRenderer()
		document.body.appendChild(renderer.domElement)

		let camera = new THREE.PerspectiveCamera(60, 1.0, 0.1, 1000)
		camera.position.set(8, 0, -4)

		let controls = new OrbitControls(camera, renderer.domElement)

		let scene = new THREE.Scene()

		const pmremGenerator = new THREE.PMREMGenerator(renderer)
		pmremGenerator.compileCubemapShader()

		// ground color: 332211
		const ground = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAIAAAAlC+aJAAAAUElEQVR42u3PQQkAAAgEsKtgBSvYv5sRfAuDFVim67UICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICFwWU9lgWxMyLbMAAAAASUVORK5CYII="

		// sky color: 99aacc
		const sky = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAIAAAAlC+aJAAAAUElEQVR42u3PQQkAAAgEsOvfwApmMZQRfAuDFViq57UICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICFwWkgfx4VZl3vYAAAAASUVORK5CYII="

		const cubeLoader = new THREE.CubeTextureLoader()
		const envMap = cubeLoader.load([ground, ground, sky, ground, ground, ground],
			function (texture) {
				const pmremTexture = pmremGenerator.fromCubemap(texture).texture
				scene.environment = pmremTexture
			}
		)

		let spheres = []

		let materials = [
			new THREE.MeshLambertMaterial(),
			new THREE.MeshNormalMaterial(),
			new THREE.MeshStandardMaterial({metalness: 1, roughness: 0})
		]

		let sides = [THREE.FrontSide, THREE.BackSide, THREE.DoubleSide]

		for (let iMat = 0; iMat < 3; iMat++) {
			for (let iSide = 0; iSide < 3; iSide++) {
				let sphere = new THREE.Mesh(
					new THREE.SphereGeometry(1, 8, 8, 0, Math.PI),
					materials[iMat].clone()
				)
				scene.add(sphere)
				spheres.push(sphere)
				sphere.position.x = (iMat - 1) * -2.5
				sphere.position.y = (iSide - 1) * -2.5
				sphere.material.side = sides[iSide]
			}
		}

		function resize() {
			renderer.setSize(window.innerWidth, window.innerHeight, false)
			camera.aspect = window.innerWidth / window.innerHeight
			camera.updateProjectionMatrix()
		}
		window.addEventListener('resize', resize)
		resize()

		let contrast = false
		window.addEventListener('keydown', e => {
			for (let sphere of spheres) {
				if (e.key === 'f') { sphere.material.side = THREE.FrontSide }
				if (e.key === 'b') { sphere.material.side = THREE.BackSide }
				if (e.key === 'd') { sphere.material.side = THREE.DoubleSide }
				if (e.key === 'c') {
					contrast = !contrast
					if (contrast) {renderer.domElement.style.filter = 'brightness(4) contrast(4)';}
					else {renderer.domElement.style.filter = ''}
				}
			}
		})

		function animate() {
			renderer.render(scene, camera)
			requestAnimationFrame(animate)
		}
		animate()
	</script>
</body>

</html>
